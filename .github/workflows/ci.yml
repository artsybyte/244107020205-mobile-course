name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Repo ini berisi banyak project Flutter per minggu, jadi setiap job
# menetapkan `working-directory` ke project yang diverifikasi.
jobs:
  notes:
    name: week5_offline_notes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-week-5-local-storage-offline-first/week5_offline_notes
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Dipin, bukan `channel: stable`. Flutter 3.50.0 (stable sejak
          # 11 Nov 2026) men-deprecate package:flutter/material.dart sehingga
          # `flutter analyze` gagal dengan puluhan info deprecated_member_use
          # tanpa ada perubahan kode sama sekali. Migrasi ke material_ui
          # dilacak di issue #10.
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        run: flutter analyze
      - name: dart format (harus bersih)
        run: dart format --output=none --set-exit-if-changed lib test
      - name: flutter test
        run: flutter test

  campus-notify:
    name: week7_campus_notify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-week-7-clean-architecture/campus_notify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test
